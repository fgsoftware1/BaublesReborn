# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
## Environment Properties
# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=1.18.2
minecraft_version_range=[1.18.2,1.19)
# The Forge version must agree with the Minecraft version to get a valid artifact
forge_version=40.3.0
forge_version_range=[40,)
# The loader version range can only use the major version of Forge/FML as bounds
loader_version_range=[40,)
# Mojang official names + Parchment parameter names/javadocs (via the Librarian plugin, forge project only).
# Format for the parchment channel: YYYY.MM.DD-MCVersion
mapping_channel=parchment
mapping_version=2022.11.06-1.18.2
# Mixin version shipped with Forge 1.18.2
mixin_version=0.8.5
# Optional integrations: JEI (maven.blamejared.com) and JER (jar in forge/libs)
jei_version=10.81.0.1029
jer_version=0.14.1.171
## Mod Properties
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=baublesreborn
mod_name=BaublesReborn
mod_license=MIT
mod_version=1.0.0
mod_group_id=io.babywolf
mod_authors=Babywolf
mod_description=Baubles is a small addon mod and api that is intended to be used by other mods to add additional inventory slots to a character.
