plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle'
    id 'org.parchmentmc.librarian.forgegradle'
    id 'org.spongepowered.mixin'
}

// The common project's sources and resources are compiled straight into this project (see below).
evaluationDependsOn(':common')
def common = project(':common')

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // Required so the IDE run configurations see the processed resources (mods.toml expansion + common resources).
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
        }

        server {
            args '--nogui'
        }

        gameTestServer {
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/'), '--existing', common.file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Released mod jars for the dev client go in forge/libs, not run/mods: they use SRG names and only work in dev
// once fg.deobf has remapped them (a jar dropped in run/mods crashes with NoSuchFieldError f_...).
repositories {
    flatDir {
        dirs 'libs'
    }
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Optional integration, dev runtime only (see ClientSetup). File: libs/configured-2.0.1-1.18.2.jar
    runtimeOnly fg.deobf("blank:configured:2.0.1-1.18.2")

    // Optional integrations (see io.babywolf.forge.compat): compiled against, never required at runtime.
    // JEI: only the API is on the compile classpath, the full mod is there for the dev client.
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    // JER has no maven and no separate API jar. File: libs/JustEnoughResources-1.18.2-${jer_version}.jar
    compileOnly fg.deobf("blank:JustEnoughResources-${minecraft_version}:${jer_version}")
    runtimeOnly fg.deobf("blank:JustEnoughResources-${minecraft_version}:${jer_version}")

    compileOnly common
    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"
}

// Compile the common sources together with the Forge sources so they end up in one jar/module.
tasks.named('compileJava', JavaCompile).configure {
    source(common.sourceSets.main.allJava)
}

// mods.toml is expanded by its own task instead of a filesMatching/expand block inside processResources:
// IDEA cannot model per-file filtering there ("Cannot resolve resource filtering of MatchingCopyAction").
def modMetadataFile = 'META-INF/mods.toml'

def generateModMetadata = tasks.register('generateModMetadata', Copy) {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    from('src/main/resources') {
        include modMetadataFile
    }
    expand replaceProperties
    into layout.buildDirectory.dir('generated/modMetadata')
}

// The raw template must not be copied as a plain resource; the expanded copy is added below.
sourceSets.main.resources.exclude modMetadataFile

tasks.named('processResources', ProcessResources).configure {
    from common.sourceSets.main.resources
    from generateModMetadata
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

// API-only build: `gradlew :forge:apiJar` (also runs as part of `build`).
// Contains just the io.babywolf.forge.api package, for other mods to compile against without the implementation.
// The package only depends on itself, Forge and Minecraft, so the jar is usable on its own.
def apiPackage = 'io/babywolf/forge/api/**'

tasks.register('apiJar', Jar) {
    group = 'build'
    description = 'Assembles a jar containing only the Baubles API classes.'
    archiveClassifier = 'api'
    from(sourceSets.main.output) {
        include apiPackage
    }
    // SRG names, like the main jar, so dependants can consume it with fg.deobf(...).
    finalizedBy 'reobfApiJar'
}

tasks.register('apiSourcesJar', Jar) {
    group = 'build'
    description = 'Assembles a sources jar for the Baubles API classes.'
    archiveClassifier = 'api-sources'
    from(sourceSets.main.allJava) {
        include apiPackage
    }
    from(common.sourceSets.main.allJava) {
        include apiPackage
    }
}

reobf {
    apiJar {}
}

tasks.named('assemble').configure {
    dependsOn 'apiJar', 'apiSourcesJar'
}
