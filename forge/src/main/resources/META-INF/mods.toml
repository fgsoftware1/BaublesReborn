modLoader = "javafml"
loaderVersion = "${loader_version_range}"
issueTrackerURL = "https://github.com/fgsoftware1/BaublesReborn/issues"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
logoFile = "logo.png"

[[dependencies.${ mod_id }]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Optional: MrCrayfish's Configured supplies the in-game config page when it is installed.
[[dependencies.${ mod_id }]]
modId = "configured"
mandatory = false
versionRange = "[0,)"
ordering = "NONE"
side = "CLIENT"

# Optional: JEI shows the recipes and gets info pages for the heart items.
[[dependencies.${ mod_id }]]
modId = "jei"
mandatory = false
versionRange = "[9.7,)"
ordering = "NONE"
side = "CLIENT"

# Optional: Just Enough Resources lists the heart chest loot.
[[dependencies.${ mod_id }]]
modId = "jeresources"
mandatory = false
versionRange = "[0,)"
ordering = "NONE"
side = "CLIENT"
